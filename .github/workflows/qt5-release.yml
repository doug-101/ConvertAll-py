name: Qt5 archived reference

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.10', '3.11', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b10b8e7837e30a2ec9a957a9a2519e4ac0334db3
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-xinerama0 libxcb-cursor0
      - name: Windows offscreen system fonts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fontDir = Join-Path $env:WINDIR 'Fonts'
          if (-not (Test-Path $fontDir -PathType Container)) { throw "Missing system fonts: $fontDir" }
          "QT_QPA_FONTDIR=$fontDir" >> $env:GITHUB_ENV
      - name: Install pinned Qt5 test environment
        run: python -m pip install -r requirements-test.txt
      - name: Validate application, archives, installer and coverage
        run: python tools/validate_release.py
      - name: Save test reports and input hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: build/test-results/
          retention-days: 14
          if-no-files-found: error

  bundle:
    name: Bundle ${{ matrix.os }} / Qt5
    needs: tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b10b8e7837e30a2ec9a957a9a2519e4ac0334db3
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-xinerama0 libxcb-cursor0
      - name: Windows offscreen system fonts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fontDir = Join-Path $env:WINDIR 'Fonts'
          if (-not (Test-Path $fontDir -PathType Container)) { throw "Missing system fonts: $fontDir" }
          "QT_QPA_FONTDIR=$fontDir" >> $env:GITHUB_ENV
      - name: Install pinned builder
        run: python -m pip install -r requirements-build.txt
      - name: Build from the tested commit
        run: python -m PyInstaller --noconfirm --clean source/convertall.spec
      - name: Exercise native CLI and GUI executables
        run: python tools/check_bundle.py dist/convertall
      - name: Create immutable source archive
        if: runner.os == 'Linux'
        run: python tools/release_source.py --commit b10b8e7837e30a2ec9a957a9a2519e4ac0334db3
      - name: Save native bundle (not a published installer)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt5-bundle-${{ matrix.os }}
          path: dist/convertall/
          retention-days: 14
          if-no-files-found: error
      - name: Save exact source archive and checksums
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt5-source-b10b8e7837e30a2ec9a957a9a2519e4ac0334db3
          path: dist/release/
          retention-days: 14
          if-no-files-found: error
