name: Qt6 release validation

# CI runs only for a commit that carries an explicit release marker, so ordinary
# commits, checkpoints and documentation pushes stay quiet and never consume
# runner minutes. The marker goes in the commit message:
#
#     git commit -m "[PROD] Prepare the 0.9.1 release"
#
# For a pull request the marker is looked up in the title or the head branch.
# A manual "Run workflow" click always runs the whole matrix, and
# tools/release_qt6.py (CI_MARKER) refuses to package a SHA that has no green
# marked push run, so the two definitions cannot drift apart unnoticed.
#
# The marker is case sensitive and deliberately not a word that appears by
# accident: never put it in a routine commit message.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Quiet pushes get their own group so they can never cancel a marked run.
  group: qt6-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[PROD]')) && 'release' || 'quiet' }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python }} / Qt6
    # Release marker gate: without it (see the header comment) this job is skipped.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[PROD]'))
      || (github.event_name == 'pull_request' && (contains(github.event.pull_request.title || '', '[PROD]') || contains(github.event.pull_request.head.ref || '', '[PROD]')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Linux Qt6 system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6 fonts-dejavu-core libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libx11-xcb1 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1
      - name: Windows offscreen system fonts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fontDir = Join-Path $env:WINDIR 'Fonts'
          if (-not (Test-Path $fontDir -PathType Container)) { throw "Missing system fonts: $fontDir" }
          "QT_QPA_FONTDIR=$fontDir" >> $env:GITHUB_ENV
      - name: Install pinned Qt6 test environment
        run: python -m pip install -r requirements-test.txt
      - name: Validate Qt6 application, archives, installer and coverage
        run: python tools/validate_release.py --require-clean
      - name: Save test reports and input hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt6-tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: build/test-results/
          retention-days: 14
          if-no-files-found: error

  native-deb:
    name: Debian native Qt / ${{ matrix.suite }}
    # Release marker gate: without it (see the header comment) this job is skipped.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[PROD]'))
      || (github.event_name == 'pull_request' && (contains(github.event.pull_request.title || '', '[PROD]') || contains(github.event.pull_request.head.ref || '', '[PROD]')))
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.suite }}-slim
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt6
    steps:
      - name: Native Debian dependencies, not PyQt wheels
        run: |
          apt-get update
          apt-get install -y git ca-certificates python3 python3-venv python3-pyqt6 python3-pyqt6.sip qt6-translations-l10n fonts-dejavu-core desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test helpers only (system Qt remains supplied by apt)
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv/debian-tests
          .venv/debian-tests/bin/python -m pip install -r requirements-test-debian.txt
      - name: Application regressions on distribution Qt (coverage gate unchanged)
        run: |
          .venv/debian-tests/bin/python -m pytest -q -m 'not pinned_qt_profile' tests/test_bases.py tests/test_catalogues.py tests/test_engine.py tests/test_gui.py tests/test_qt6_migration.py tests/test_resources.py tests/test_options.py tests/test_option_locale.py tests/test_cli.py tests/test_cli_validator.py --cov=source --cov-branch --cov-report=xml:build/native-debian/coverage.xml --cov-report=json:build/native-debian/coverage.json --junitxml=build/native-debian/junit.xml
      - name: Verify the distribution Qt runtime with the system interpreter
        run: |
          /usr/bin/python3 -E -s tools/build_deb.py --probe-system --output-dir build/native-debian
      - name: Build and execute the thin .deb with system Python outside the test venv
        run: |
          /usr/bin/python3 -E -s tools/build_deb.py --output-dir build/native-debian --maintainer 'ConvertAll-py CI <jojo8356@users.noreply.github.com>'
      - name: Save distribution runtime/package/coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt6-native-deb-${{ matrix.suite }}
          path: build/native-debian/
          retention-days: 14
          if-no-files-found: error

  bundle:
    name: Bundle ${{ matrix.os }} / Qt6
    needs: tests
    # Release marker gate: without it (see the header comment) this job is skipped.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[PROD]'))
      || (github.event_name == 'pull_request' && (contains(github.event.pull_request.title || '', '[PROD]') || contains(github.event.pull_request.head.ref || '', '[PROD]')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Linux Qt6 system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6 fonts-dejavu-core libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libx11-xcb1 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1
      - name: Windows offscreen system fonts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fontDir = Join-Path $env:WINDIR 'Fonts'
          if (-not (Test-Path $fontDir -PathType Container)) { throw "Missing system fonts: $fontDir" }
          "QT_QPA_FONTDIR=$fontDir" >> $env:GITHUB_ENV
      - name: Install pinned Qt6 builder
        run: python -m pip install -r requirements-build.txt
      - name: Build from the tested commit
        run: python -m PyInstaller --noconfirm --clean source/convertall.spec
      - name: Exercise Qt6 native CLI and GUI executables
        run: python tools/check_bundle.py dist/convertall --report build/test-results/bundle-validation.json
      - name: Create immutable Qt6 source archive
        if: runner.os == 'Linux'
        run: python tools/release_source.py --commit ${{ github.sha }}
      - name: Save bundle runtime and file hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt6-bundle-report-${{ matrix.os }}
          path: build/test-results/bundle-validation.json
          retention-days: 14
          if-no-files-found: warn
      - name: Save native bundle (not a published installer)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt6-bundle-${{ matrix.os }}
          path: dist/convertall/
          retention-days: 14
          if-no-files-found: error
      - name: Save exact Qt6 source archive and checksums
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt6-source-${{ github.sha }}
          path: dist/release/
          retention-days: 14
          if-no-files-found: error
