[pytest]
minversion = 9.1
qt_api = pyqt6
testpaths = tests tools/test_qt_migration_tools.py
pythonpath = source tools .
addopts = -ra --strict-markers --strict-config
markers =
    gui: Qt6 widgets, signals and keyboard interaction (offscreen by default)
    integration: subprocess, installation and real application entry point
    packaging: source archive and packaging recipe checks
    pinned_qt_profile: exact frozen-wheel profile (native Debian has its own runtime-origin checks)
filterwarnings =
    error::DeprecationWarning:convertall
